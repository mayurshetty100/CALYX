# ==============================================================================
# CALYX RENDER BLUEPRINT (Free Tier Compliant)
# ==============================================================================
# File: render.yaml
# Purpose:
#   Deploys the Calyx Backend on Render's 100% FREE Tier.
#   Uses a single Web Service running the Calyx Unified Gateway & Microservice
#   Engine with Standalone Mode enabled.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # CALYX BACKEND WEB SERVICE (100% Free Tier Compatible)
  # ----------------------------------------------------------------------------
  - type: web
    name: calyx-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir -r docker/requirements.gateway.txt"
    startCommand: "python -m uvicorn services.calyx_gateway_service.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SERVICE_NAME
        value: calyx-backend
      - key: STANDALONE_GATEWAY_MODE
        value: "true"
      - key: ALLOWED_CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
