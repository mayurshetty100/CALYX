# ==============================================================================
# CALYX KUBERNETES MANIFEST: API GATEWAY SERVICE DEPLOYMENT & SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calyx-gateway-service
  namespace: calyx
  labels:
    app: calyx-gateway-service
    tier: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calyx-gateway-service
  template:
    metadata:
      labels:
        app: calyx-gateway-service
    spec:
      containers:
        - name: calyx-gateway-service
          image: calyx/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "calyx-gateway-service"
            - name: PORT
              value: "8000"
            - name: AUTH_SERVICE_URL
              value: "http://calyx-auth-service:8001"
            - name: JOB_SERVICE_URL
              value: "http://calyx-job-service:8002"
            - name: RESUME_SERVICE_URL
              value: "http://calyx-resume-service:8003"
            - name: AGENT_SERVICE_URL
              value: "http://calyx-agent-service:8004"
            - name: ANALYTICS_SERVICE_URL
              value: "http://calyx-analytics-service:8005"
            - name: ALLOWED_CORS_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: calyx-gateway-service
  namespace: calyx
  labels:
    app: calyx-gateway-service
spec:
  type: ClusterIP
  selector:
    app: calyx-gateway-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
