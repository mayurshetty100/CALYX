# ==============================================================================
# CALYX KUBERNETES MANIFEST: CONFIGMAPS & SECRETS
# ==============================================================================
# Concept Explanation for Beginners:
# 1. ConfigMaps: Store non-sensitive configuration data (log levels, service names, ports).
# 2. Secrets: Store sensitive passwords, database credentials, and cryptographic JWT keys.
#    In Kubernetes, Secrets are Base64-encoded and mounted securely into pods as environment variables.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: calyx-common-config
  namespace: calyx
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT_AUTH: "8001"
  PORT_JOB: "8002"
  PORT_RESUME: "8003"
  PORT_AGENT: "8004"
  PORT_ANALYTICS: "8005"
  MONGODB_DATABASE_NAME: "calyx_jobs_db"
  JOB_SERVICE_URL: "http://calyx-job-service:8002"

---
apiVersion: v1
kind: Secret
metadata:
  name: calyx-secrets
  namespace: calyx
type: Opaque
stringData:
  JWT_SECRET_KEY: "calyx-super-secret-production-grade-encryption-key-change-in-prod-12345"
  AUTH_DB_PASSWORD: "calyx_secure_password_123"
  ANALYTICS_DB_PASSWORD: "calyx_secure_password_123"
  DATABASE_URL_AUTH: "postgresql://calyx_user:calyx_secure_password_123@calyx-auth-db:5432/calyx_auth"
  MONGODB_URL: "mongodb://calyx-job-db:27017"
  REDIS_URL: "redis://calyx-redis:6379/0"
  DATABASE_URL_ANALYTICS: "postgresql://calyx_user:calyx_secure_password_123@calyx-analytics-db:5432/calyx_analytics"
