# ==============================================================================
# CALYX KUBERNETES MANIFEST: ANALYTICS & REPORTING MICROSERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calyx-analytics-service
  namespace: calyx
  labels:
    app: calyx-analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calyx-analytics-service
  template:
    metadata:
      labels:
        app: calyx-analytics-service
    spec:
      containers:
        - name: analytics-service
          image: calyx/analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: SERVICE_NAME
              value: "calyx-analytics-service"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: calyx-common-config
                  key: PORT_ANALYTICS
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calyx-secrets
                  key: DATABASE_URL_ANALYTICS
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: calyx-analytics-service
  namespace: calyx
  labels:
    app: calyx-analytics-service
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
      name: http
  selector:
    app: calyx-analytics-service
